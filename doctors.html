<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Find Doctors - MedCare</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="main-header">

        <a
            href="dashboard.html"
            class="logo"
        >
            MedCare
        </a>


        <nav class="main-nav">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a
                href="doctors.html"
                class="active-link"
            >
                Find Doctors
            </a>

            <a href="#">
                Appointments
            </a>

            <a href="#">
                Medical Records
            </a>

            <button id="logoutBtn">
                Logout
            </button>

        </nav>

    </header>



    <!-- ==========================================
         MAIN
    =========================================== -->

    <main class="doctors-page">


        <!-- ==========================================
             PAGE HEADER
        =========================================== -->

        <section class="doctors-hero">

            <p class="page-label">
                MEDCARE DOCTORS
            </p>

            <h1>
                Find the right doctor for you
            </h1>

            <p>
                Search and connect with qualified
                healthcare professionals.
            </p>

        </section>



        <!-- ==========================================
             SEARCH AREA
        =========================================== -->

        <section class="doctor-search-section">

            <div class="doctor-search-box">

                <div class="search-input-wrapper">

                    <span>
                        🔍
                    </span>

                    <input
                        type="text"
                        id="doctorSearch"
                        placeholder="Search by doctor name or specialty..."
                    >

                </div>


                <div class="specialty-wrapper">

                    <select id="specialtyFilter">

                        <option value="all">
                            All Specialties
                        </option>

                        <option value="cardiology">
                            Cardiology
                        </option>

                        <option value="neurology">
                            Neurology
                        </option>

                        <option value="dermatology">
                            Dermatology
                        </option>

                        <option value="pediatrics">
                            Pediatrics
                        </option>

                        <option value="orthopedics">
                            Orthopedics
                        </option>

                        <option value="psychiatry">
                            Psychiatry
                        </option>

                    </select>

                </div>

            </div>

        </section>



        <!-- ==========================================
             RESULTS HEADER
        =========================================== -->

        <section class="doctors-results-header">

            <h2>
                Available Doctors
            </h2>

            <span id="doctorCount">
                0 doctors
            </span>

        </section>



        <!-- ==========================================
             DOCTORS GRID
        =========================================== -->

        <section
            class="doctors-grid"
            id="doctorsGrid"
        >

            <!-- Doctors will be loaded by JavaScript -->

        </section>


    </main>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="main-footer">

        <p>
            © 2026 MedCare. All rights reserved.
        </p>

        <p>
            Demo Medical Platform
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
